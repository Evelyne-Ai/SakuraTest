services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [.env]
    environment:
      PORT: "4000"
      DATA_DIR: "/data"
      CORS_ORIGINS: "http://localhost:8080"
    expose: ["4000"]
    volumes: ["sakuraapis-data:/data"]
    restart: unless-stopped
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped

volumes:
  sakuraapis-data:
